events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    client_max_body_size 25M;
    server_tokens off;

    # Resolver interno de Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ==========================================
    # 1. BLOQUE HTTP (PUERTO 80)
    # Validación Let's Encrypt y Redirección 301
    # ==========================================
    server {
        listen 80;
        server_name your.domain.com; # <------ Cambia a tu dominio

        # Desafío HTTP-01 de Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir el resto del tráfico a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # 2. BLOQUE HTTPS (PUERTO 443)
    # Servicio Cifrado y Proxy Inverso
    # ==========================================
    server {
        listen 443 ssl;
        http2 on;
        server_name your.domain.com; # <------ Cambia a tu dominio

        # Rutas de los certificados generados por Certbot
        ssl_certificate     /etc/letsencrypt/live/<tudominio>/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/<tudominio>/privkey.pem;

        # Parámetros criptográficos seguros
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Cabeceras de seguridad
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /usr/share/nginx/html;
        index index.html;

        # Acceso directo al formulario web de inicio de sesión
        location = /login.html {
            try_files $uri =404;
        }

        # Pantalla estática tras el cierre de sesión
        location = /logout {
            default_type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            return 200 '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>LOGOUT // NEURAL DECK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet"><style>body{background:#06070a;color:#d8e2ec;font-family:"Share Tech Mono",monospace;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;gap:20px;text-align:center;}h1{font-family:"Orbitron",monospace;color:#ff0055;margin:0;letter-spacing:2px;}.btn{border:1px solid #00f0ff;color:#00f0ff;padding:12px 24px;text-decoration:none;font-weight:bold;font-size:0.9rem;transition:0.2s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);}.btn:hover{background:#00f0ff;color:#000;box-shadow:0 0 16px rgba(0,240,255,0.6);}</style></head><body><h1>// SESSION_TERMINATED</h1><p style="color:#5c697e;">Sesión finalizada. Credenciales purgadas.</p><a href="/login.html" class="btn">⮌ INICIAR SESIÓN</a></body></html>';
        }

        # Audios generados por Edge-TTS con resolución dinámica
        location ^~ /audio/ {
            set $upstream_api http://api:8001;
            proxy_pass $upstream_api/audio/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Streaming de audios MP3 locales
        location ~* \.mp3$ {
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Proxy inverso hacia FastAPI con soporte de cookies
        location /api/ {
            set $upstream_api http://api:8001;
            proxy_pass $upstream_api$request_uri;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Paso de cookies de sesión HttpOnly entre navegador y FastAPI
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Enrutamiento de páginas estáticas
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}