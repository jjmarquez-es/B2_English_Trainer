<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY // USER MANAGEMENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <style>
        .table-cyber {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Share Tech Mono', monospace;
            margin-top: 15px;
        }
        .table-cyber th {
            text-align: left;
            padding: 10px;
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            font-size: 0.8rem;
        }
        .table-cyber td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
        }
        
        /* Badges de Roles */
        .badge-role {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 2px;
        }
        .badge-admin { border: 1px solid var(--neon-pink); color: var(--neon-pink); background: rgba(255, 0, 85, 0.08); }
        .badge-user { border: 1px solid var(--neon-green); color: var(--neon-green); background: rgba(0, 255, 65, 0.08); }

        /* Badges de Estado ONLINE / OFFLINE */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .status-online {
            background: rgba(0, 255, 65, 0.15);
            color: var(--neon-green, #00ff41);
            border: 1px solid var(--neon-green, #00ff41);
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.25);
        }
        .status-offline {
            background: rgba(120, 120, 120, 0.1);
            color: #888888;
            border: 1px solid #444444;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-online .status-dot {
            background-color: var(--neon-green, #00ff41);
            box-shadow: 0 0 6px var(--neon-green, #00ff41);
            animation: pulse-dot 1.5s infinite;
        }
        .status-offline .status-dot {
            background-color: #666;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="prompt-container" style="max-width: 960px;">
        <header class="prompt-nav" style="border-bottom-color: var(--neon-pink);">
            <div>
                <div style="font-family: 'Share Tech Mono'; font-size: 0.75rem; color: var(--neon-pink); margin-bottom: 4px;">
                    SECURITY_MODULE // ACCESS_CONTROL_LEVEL_0
                </div>
                <h1 style="font-family: 'Orbitron'; font-size: 1.4rem; color: #fff; margin: 0;">
                    GESTOR DE OPERADORES Y USUARIOS
                </h1>
            </div>
            <div class="nav-actions">
                <a href="index.html" class="nav-back-btn yellow">TRACKER</a>
                <a href="vobaudi.html" class="nav-back-btn cyan">VOBAUDI</a>
                <a href="grammar_deck.html" class="nav-back-btn pink">GRAMMAR</a>
                <a href="speaking.html" class="nav-back-btn blue">SPEAKING</a>
                <a href="prompt.html" class="nav-back-btn green">PROMPTS</a>
                <a href="types_of_text.html" class="nav-back-btn orange">TEXT_TYPES</a>
                <a href="exams.html" class="nav-back-btn purple">EXAM_CLINIC</a>
                <a href="admin_users.html" class="nav-back-btn red admin-only">OPERATORS</a>
                <button class="nav-back-btn pink" onclick="logout()">LOGOUT</button>
            </div>
        </header>

        <!-- FORMULARIO ALTA DE USUARIO -->
        <section class="protocol-card" style="border-color: var(--neon-pink); margin-bottom: 20px;">
            <h2 style="color: var(--neon-pink); font-size: 1rem;">// REGISTRAR NUEVO ACCESO</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr 120px auto; gap: 12px; margin-top: 15px; align-items: flex-end;">
                <div>
                    <label style="font-family: 'Share Tech Mono'; font-size: 0.75rem; color: var(--neon-cyan);">USUARIO:</label>
                    <input type="text" id="new-user" class="cyber-input" placeholder="ej. operador_2">
                </div>
                <div>
                    <label style="font-family: 'Share Tech Mono'; font-size: 0.75rem; color: var(--neon-yellow);">CONTRASEÑA TEMPORAL:</label>
                    <input type="password" id="new-pass" class="cyber-input" placeholder="Min. 6 caracteres">
                </div>
                <div>
                    <label style="font-family: 'Share Tech Mono'; font-size: 0.75rem; color: var(--text-dim);">ROL:</label>
                    <select id="new-role" class="cyber-select" style="width: 100%;">
                        <option value="user">USER</option>
                        <option value="admin">ADMIN</option>
                    </select>
                </div>
                <button class="cyber-btn pink" onclick="handleCreateUser()">REGISTRAR</button>
            </div>
            <div id="status-msg" style="font-family: 'Share Tech Mono'; font-size: 0.8rem; margin-top: 10px;"></div>
        </section>

        <!-- LISTA DE USUARIOS ACTIVOS -->
        <section class="protocol-card" style="border-color: var(--neon-cyan);">
            <h2 style="color: var(--neon-cyan); font-size: 1rem;">// OPERADORES REGISTRADOS EN BASE DE DATOS</h2>
            <table class="table-cyber">
                <thead>
                    <tr>
                        <th>OPERATOR</th>
                        <th>ROLE</th>
                        <th>STATUS</th>
                        <th>LAST SEEN</th>
                        <th style="text-align: right;">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- Se rellena dinámicamente con JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script>
        const API_BASE = "/api";
        let currentAdminUser = "";

        async function init() {
		try {
			const res = await fetch(`${API_BASE}/user/whoami`, { credentials: 'include' });
			if (!res.ok) throw new Error("No autenticado");
			const who = await res.json();
			
			if (who.role !== 'admin') {
				alert("Acceso denegado: Zona exclusiva para administradores.");
				window.location.href = '/index.html';
				return;
			}
			currentAdminUser = who.username;
		} catch (e) {
			window.location.href = '/login.html';
			return;
		}

		// 1. Carga inicial inmediata
		await loadUserList();

		// 2. Comprobación periódica cada 10 segundos (10000 ms)
		setInterval(() => {
			// Solo ejecuta la petición si la pestaña del navegador está visible
			if (!document.hidden) {
				loadUserList();
			}
		}, 10000);
	}

        function formatLastLogin(epoch) {
            if (!epoch) return '<span style="color: #666;">NEVER</span>';
            
            const date = new Date(epoch * 1000);
            const now = new Date();
            const diffMin = Math.floor((now - date) / 60000);

            if (diffMin < 1) return '<span style="color: var(--neon-cyan, #00e5ff); font-weight: bold;">JUST NOW</span>';
            if (diffMin < 60) return `${diffMin}m AGO`;
            
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        async function loadUserList() {
            const tbody = document.getElementById('users-tbody');
            try {
                const res = await fetch(`${API_BASE}/admin/users`, { credentials: 'include' });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || `HTTP ${res.status}`);
                }

                const rawData = await res.json();
                const users = Array.isArray(rawData) ? rawData : (rawData.users || []);

                renderUsers(users);
            } catch (err) {
                console.error("Error cargando operadores:", err);
                tbody.innerHTML = `<tr><td colspan="5" style="color: var(--neon-pink); text-align: center; padding: 20px;">[ERROR] Fallo cargando operadores: ${err.message}</td></tr>`;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-dim); padding: 15px;">No se han encontrado registros en base de datos.</td></tr>`;
                return;
            }

            users.forEach(u => {
                const isSelf = u.username.toLowerCase() === currentAdminUser.toLowerCase();
                const isProtected = u.username.toLowerCase() === 'admin' || u.username.toLowerCase() === 'spacemans8';

                const roleBadge = u.role === 'admin' 
                    ? '<span class="badge-role badge-admin">ADMIN</span>' 
                    : '<span class="badge-role badge-user">STUDENT</span>';

                const statusHtml = u.is_online
                    ? `<span class="badge-status status-online"><span class="status-dot"></span>ONLINE</span>`
                    : `<span class="badge-status status-offline"><span class="status-dot"></span>OFFLINE</span>`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: #fff; font-weight: bold;">
                        ${u.username}
                        ${isSelf ? '<span style="color: var(--neon-yellow); font-size: 0.7rem; margin-left: 6px;">(TU CUENTA)</span>' : ''}
                    </td>
                    <td>${roleBadge}</td>
                    <td>${statusHtml}</td>
                    <td style="font-family: monospace; font-size: 0.8rem; color: var(--text-dim);">${formatLastLogin(u.last_login)}</td>
                    <td style="text-align: right;">
                        <button class="play-btn-mini" onclick="promptResetPass('${u.username}')" style="margin-right: 6px;">PASS</button>
                        ${!isSelf && !isProtected ? `<button class="del-btn" onclick="handleDeleteUser('${u.username}')">BORRAR</button>` : ''}
                        ${isProtected && !isSelf ? `<span style="color: #666; font-size: 0.75rem;">ROOT</span>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleCreateUser() {
            const username = document.getElementById('new-user').value.trim().toLowerCase();
            const password = document.getElementById('new-pass').value.trim();
            const role = document.getElementById('new-role').value;
            const status = document.getElementById('status-msg');

            if (!username || !password) {
                status.innerHTML = "<span style='color: var(--neon-pink);'>Debes indicar usuario y contraseña.</span>";
                return;
            }

            status.innerHTML = "<span style='color: var(--neon-yellow);'>Registrando operador...</span>";

            try {
                const res = await fetch(`${API_BASE}/admin/users`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || "Error registrando usuario");
                }

                status.innerHTML = `<span style='color: var(--neon-green);'>Usuario '${username}' registrado con éxito.</span>`;
                document.getElementById('new-user').value = "";
                document.getElementById('new-pass').value = "";
                await loadUserList();
            } catch (e) {
                status.innerHTML = `<span style='color: var(--neon-pink);'>${e.message}</span>`;
            }
        }

        async function handleDeleteUser(user) {
            if (!confirm(`¿Confirmas la baja inmediata del usuario '${user}'? Sus datos y sesiones se purgarán.`)) return;

            try {
                const res = await fetch(`${API_BASE}/admin/users/${user}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || "Error eliminando usuario");
                }
                await loadUserList();
            } catch (e) {
                alert(`Fallo al eliminar: ${e.message}`);
            }
        }

        async function promptResetPass(user) {
            const newPass = prompt(`Introduce la nueva contraseña para '${user}' (mínimo 6 caracteres):`);
            if (!newPass || newPass.trim().length < 6) return;

            try {
                const res = await fetch(`${API_BASE}/admin/users/${user}/reset-password`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password: newPass.trim() })
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || "Error actualizando contraseña");
                }
                alert(`Contraseña actualizada para '${user}'.`);
            } catch (e) {
                alert(`Error restableciendo contraseña: ${e.message}`);
            }
        }

        async function logout() {
            try {
                await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
            } catch (e) {}
            window.location.replace('/login.html');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
